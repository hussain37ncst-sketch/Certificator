  <div class="row justify-content-center">
    <div class="col-12 col-lg-6">
      <div class="card shadow-sm cert-card">
        <div class="card-body">
          <h2>Contact Us</h2>
          <p class="text-muted">Send us a message and we will reply soon.</p>
          <form>
            <label class="form-label mt-2">Name</label>
            <input type="text" class="form-control" placeholder="Your name">
            <label class="form-label mt-3">Email</label>
            <input type="email" class="form-control" placeholder="you@example.com">
            <label class="form-label mt-3">Message</label>
            <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
            <button type="button" class="btn btn-outline-danger mt-4">Send</button>
          </form>
        </div>
      </div>
